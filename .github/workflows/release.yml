name: Vydat WHS Asistenta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Stahnout zdrojovy kod
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pripravit Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Nainstalovat zavislosti
        run: python -m pip install -r app/requirements.txt

      - name: Spustit testy
        run: python -B -m unittest discover -s tests -q

      - name: Vytvorit prenosny ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./package.ps1 -Version "$env:RELEASE_TAG"

      - name: Publikovat vydani s ZIPem
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = Join-Path ./dist ("WHS-Asistent-" + $env:RELEASE_TAG + ".zip")
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw 'Chybi ZIP pro vydavanou verzi.'
          }
          gh release create "$env:RELEASE_TAG" "$package" --verify-tag --title "WHS Asistent $env:RELEASE_TAG" --generate-notes
